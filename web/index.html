<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Universe Map</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <canvas id="three-canvas"></canvas>
        <div id="ui-overlay">
            <div id="info-panel">
                <h1>3D Interactive Universe Map</h1>
                <p id="status">Loading galaxies...</p>
                <p id="count"></p>
                <p id="scale-narr"></p>
                <p id="selection"></p>
                <div id="search">
                    <input id="search-input" type="text" placeholder="RA Dec distance · e.g. 192 3 400 · or target" autocomplete="off">
                    <button id="btn-search">Go</button>
                </div>
                <div id="controls">
                    <button id="btn-zoom">Zoom Out</button>
                    <button id="btn-lightwave">Light Speed Wave</button>
                </div>
                <div id="tours">
                    <span class="group-label">Guided tour</span>
                    <div id="tour-buttons">
                        <button class="tour" data-tour="earth">You Are Here</button>
                        <button class="tour" data-tour="sloan">Sloan Great Wall</button>
                        <button class="tour" data-tour="void">Cosmic Void</button>
                    </div>
                    <p id="tour-caption"></p>
                </div>
                <div id="filters">
                    <span class="group-label">Filter by distance</span>
                    <div id="filter-buttons">
                        <button class="filter active" data-filter="all">All</button>
                        <button class="filter" data-filter="near">Nearby (&lt;150 Mpc)</button>
                        <button class="filter" data-filter="far">Far (≥150 Mpc)</button>
                    </div>
                </div>
                <div id="timescale">
                    <label for="timescale-slider">Time speed: <span id="timescale-value">200M yr/s</span></label>
                    <input type="range" id="timescale-slider" min="1" max="2000" value="200">
                    <p id="timescale-note">Real speed of light · 1 Mpc per 3.26M years</p>
                </div>
            </div>
            <div id="galaxy-card" class="hidden">
                <button id="card-close" title="Close">×</button>
                <h2>Galaxy Details</h2>
                <div id="card-body"></div>
            </div>
        </div>
    </div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
